<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish with Jarett — Business Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    @page {
      size: letter;
      margin: 0.5in;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      background: #e8dfd0;
      color: #f2ebe0;
    }

    .sheet {
      max-width: 8.5in;
      margin: 0 auto;
      padding: 0.5in;
    }

    .hint {
      margin: 0 0 1rem;
      font-size: 12px;
      color: #5c6b6e;
      max-width: 36rem;
    }

    .hint strong { color: #0c1f24; }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35in;
    }

    /* US standard business card */
    .card {
      width: 3.5in;
      height: 2in;
      position: relative;
      border-radius: 0.06in;
      padding: 2.5px;
      background: linear-gradient(135deg, #d4c4a8 0%, #c8d9d4 35%, #1f5a63 70%, #d4c4a8 100%);
      box-shadow: 0 2px 10px rgba(12, 31, 36, 0.22);
    }

    .card__inner {
      width: 100%;
      height: 100%;
      border-radius: 0.045in;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(180deg, rgba(8, 18, 22, 0.55) 0%, rgba(8, 18, 22, 0.28) 42%, rgba(8, 18, 22, 0.72) 100%),
        url("img/King-Salmon-Business-Card.jpg") center / cover no-repeat;
      color: #f2ebe0;
    }

    .card__top {
      padding: 0.16in 0.16in 0;
      text-align: center;
    }

    .card__brand {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 28px;
      line-height: 1.05;
      letter-spacing: -0.01em;
      white-space: nowrap;
      width: 100%;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
    }

    .card__tagline {
      margin: 0.04in 0 0;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #c8d9d4;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
    }

    .card__states {
      margin: 0.05in 0 0;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(242, 235, 224, 0.9);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
    }

    .card__bottom {
      padding: 0 0.12in 0.1in;
      text-align: center;
    }

    .card__phone {
      display: block;
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #d4c4a8;
      text-decoration: none;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);
    }

    @media print {
      html, body { background: #fff; }
      .sheet { padding: 0; }
      .hint { display: none; }
      .card { box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <p class="hint">
      <strong>Fish with Jarett business card</strong> — US standard <strong>3.5&nbsp;×&nbsp;2&nbsp;in</strong>.
      In Chrome: Print → Save as PDF → Letter, margins Default or None, <strong>Background graphics On</strong>.
      Trim to card size at the printer.
    </p>

    <div class="cards">
      <article class="card" aria-label="Fish with Jarett business card">
        <div class="card__inner">
          <div class="card__top">
            <h1 class="card__brand">Fish with Jarett</h1>
            <p class="card__tagline">Lake Michigan Tributaries</p>
            <p class="card__states">Wisconsin — Indiana — Michigan</p>
          </div>
          <div class="card__bottom">
            <a class="card__phone" href="tel:+16303960975">(630) 396-0975</a>
          </div>
        </div>
      </article>
    </div>
  </div>
</body>
</html>
