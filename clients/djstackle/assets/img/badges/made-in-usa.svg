<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Made in USA">
  <defs>
    <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c76b"/>
      <stop offset="55%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8f6a12"/>
    </linearGradient>
    <clipPath id="face">
      <circle cx="120" cy="120" r="72"/>
    </clipPath>
  </defs>

  <circle cx="120" cy="120" r="116" fill="#0a1628"/>
  <circle cx="120" cy="120" r="110" fill="none" stroke="url(#ringGold)" stroke-width="6"/>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#f2f2f0" stroke-width="1.5" opacity=".45"/>
  <circle cx="120" cy="120" r="72" fill="none" stroke="url(#ringGold)" stroke-width="2"/>

  <path id="usaTop" d="M 38 120 A 82 82 0 0 1 202 120" fill="none"/>
  <text fill="#f2f2f0" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" letter-spacing="3">
    <textPath href="#usaTop" startOffset="50%" text-anchor="middle">MADE IN</textPath>
  </text>

  <!-- Bottom U.S.A. — upright letters, tops outward -->
  <g fill="url(#ringGold)" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text transform="rotate(-145 120 120) translate(120 38)">U</text>
    <text transform="rotate(-160 120 120) translate(120 38)">.</text>
    <text transform="rotate(-175 120 120) translate(120 38)">S</text>
    <text transform="rotate(-190 120 120) translate(120 38)">.</text>
    <text transform="rotate(-205 120 120) translate(120 38)">A</text>
  </g>

  <g clip-path="url(#face)">
    <rect x="48" y="48" width="144" height="144" fill="#b22234"/>
    <rect x="48" y="62" width="144" height="12" fill="#fff"/>
    <rect x="48" y="86" width="144" height="12" fill="#fff"/>
    <rect x="48" y="110" width="144" height="12" fill="#fff"/>
    <rect x="48" y="134" width="144" height="12" fill="#fff"/>
    <rect x="48" y="158" width="144" height="12" fill="#fff"/>
    <rect x="48" y="48" width="62" height="56" fill="#0b1f4a"/>
    <g fill="#fff">
      <circle cx="58" cy="58" r="2.4"/>
      <circle cx="72" cy="58" r="2.4"/>
      <circle cx="86" cy="58" r="2.4"/>
      <circle cx="100" cy="58" r="2.4"/>
      <circle cx="65" cy="68" r="2.4"/>
      <circle cx="79" cy="68" r="2.4"/>
      <circle cx="93" cy="68" r="2.4"/>
      <circle cx="58" cy="78" r="2.4"/>
      <circle cx="72" cy="78" r="2.4"/>
      <circle cx="86" cy="78" r="2.4"/>
      <circle cx="100" cy="78" r="2.4"/>
      <circle cx="65" cy="88" r="2.4"/>
      <circle cx="79" cy="88" r="2.4"/>
      <circle cx="93" cy="88" r="2.4"/>
      <circle cx="58" cy="98" r="2.4"/>
      <circle cx="72" cy="98" r="2.4"/>
      <circle cx="86" cy="98" r="2.4"/>
      <circle cx="100" cy="98" r="2.4"/>
    </g>
  </g>
