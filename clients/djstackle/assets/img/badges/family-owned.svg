<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Family Owned and Operated">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c76b"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a67c1a"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="116" fill="#141414"/>
  <circle cx="120" cy="120" r="110" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="#f2f2f0" stroke-width="1.5" opacity=".55"/>
  <circle cx="120" cy="120" r="56" fill="none" stroke="url(#gold)" stroke-width="1.25" opacity=".7"/>

  <path id="foTop" d="M 42 120 A 78 78 0 0 1 198 120" fill="none"/>
