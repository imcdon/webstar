---
deployment:
  tasks:
    # Webstar Business Services ONLY — never deploy this repo to $HOME/public_html.
    # public_html is often the account default and must stay free of this project
    # (and must not be the document root for superioriceadventures.com).
    #
    # Domains → document roots:
    #   webstarbusinessservices.com
    #     → $HOME/webstarbusinessservices.com
    #   superior-ice-adventures.webstarbusinessservices.com
    #     → $HOME/webstarbusinessservices.com/clients/superior-ice-adventures
    #   superioriceadventures.com (live client site, separate deploy)
    #     → $HOME/superioriceadventures.com   (NOT public_html)
    - export DEPLOYPATH=$HOME/webstarbusinessservices.com
    - /bin/mkdir -p $DEPLOYPATH/clients/superior-ice-adventures
    - /usr/bin/rsync -a --exclude='.git' --exclude='.cpanel.yml' --exclude='library/mail-config.php' ./ $DEPLOYPATH/
