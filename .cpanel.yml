---
deployment:
  tasks:
    # Live site document root is public_html (confirmed Oct 2026).
    # Git clone stays separate (e.g. $HOME/repositories/webstar).
    - export DEPLOYPATH=$HOME/public_html
    - /bin/mkdir -p $DEPLOYPATH/clients/superior-ice-adventures
    - /bin/mkdir -p $DEPLOYPATH/clients/fishwithjarett
    - /bin/mkdir -p $DEPLOYPATH/clients/djstackle
    - /bin/mkdir -p $DEPLOYPATH/clients/djstackle/data
    - /bin/mkdir -p $DEPLOYPATH/clients/djstackle/.well-known
    - /bin/mkdir -p $DEPLOYPATH/clients/shared/shop
    - /bin/mkdir -p $DEPLOYPATH/lead-gen/data
    - /usr/bin/rsync -a --exclude='.git' --exclude='.cpanel.yml' --exclude='library/mail-config.php' --exclude='library/calendar-config.php' --exclude='library/.calendar-access.json' --exclude='clients/*/includes/shop-config.php' --exclude='clients/*/data' --exclude='lead-gen/.env' --exclude='lead-gen/data' ./ $DEPLOYPATH/
    # Apache must be able to read .htaccess and traverse directories (avoids 403).
    - /bin/chmod 755 $DEPLOYPATH
    - /bin/chmod 644 $DEPLOYPATH/.htaccess
    - /usr/bin/find $DEPLOYPATH -type d -exec /bin/chmod 755 {} +
    - /usr/bin/find $DEPLOYPATH -type f -exec /bin/chmod 644 {} +
